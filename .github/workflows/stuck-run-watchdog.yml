name: stuck-run-watchdog

# 定时扫描本仓库卡死的 workflow 运行：状态停在 in_progress / queued 且已超过阈值。
#
# 背景：GitHub 偶发「矩阵腿未被创建」或「运行排队不启动」，此时运行会永远停在
# in_progress / queued，且所有补救接口互相矛盾（cancel 说已完成、force-cancel 说
# 不在运行、rerun 说正在运行、delete 返回 403）。这类死锁只能人工跟进，但没有监控
# 时根本不会有人发现——曾有一条挂 11 小时才被偶然看到。
#
# 本 workflow 做两件事：
#   1) 能取消的直接取消（绝大多数卡死属于 runner 侧，cancel 有效）；
#   2) 取消不掉的汇总成一个 issue（去重：已有开启中的 issue 就追加评论），
#      把 run URL 和原始报错留在里面，方便照单找 GitHub Support。
on:
  schedule:
    # 每 3 小时一次，避开整点（GitHub 定时任务在整点最拥挤，常被延迟数十分钟）
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: '判定卡死的时长阈值（小时）'
        required: false
        default: '2'
      dry_run:
        description: '只报告不取消（true / false）'
        required: false
        default: 'false'

permissions:
  actions: write   # 取消运行
  issues: write    # 开 / 更新提醒 issue
  contents: read

# 自身不并发，避免两次扫描同时开 issue
concurrency:
  group: stuck-run-watchdog
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 扫描并处理卡死运行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh 未 checkout 时无法从 git 推断仓库，所有命令必须靠 GH_REPO 定位
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '2' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          if ! [[ "$MAX_AGE_HOURS" =~ ^[0-9]+$ ]]; then
            echo "::error::max_age_hours 必须是整数，收到：$MAX_AGE_HOURS"
            exit 1
          fi
          cutoff=$(date -u -d "-${MAX_AGE_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          echo "阈值：创建时间早于 $cutoff（即已卡死超过 ${MAX_AGE_HOURS}h）"
          echo "dry_run=$DRY_RUN"

          # 只取 in_progress / queued 两种状态。waiting（等待部署审批）是合法状态，不处理。
          # 每页 100 条足够：本仓库历史运行总量远小于该值；超出的极端情况下一轮会补上。
          tmp=$(mktemp)
          : > "$tmp"
          for st in in_progress queued; do
            gh api "repos/$REPO/actions/runs?status=$st&per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .head_branch, .created_at, .status, (.html_url)] | @tsv' \
              >> "$tmp" || true
          done

          stuck=0
          cancelled=0
          failed_ids=()
          while IFS=$'\t' read -r id name branch created status url; do
            [ -z "${id:-}" ] && continue
            # 跳过自己
            [ "$id" = "$SELF_RUN_ID" ] && continue
            # created_at 是 ISO8601 Z，字符串比较对同格式有效
            [[ "$created" < "$cutoff" ]] || continue

            stuck=$((stuck + 1))
            echo "::warning::卡死运行 #$id $name [$branch] status=$status created=$created"
            echo "  $url"

            if [ "$DRY_RUN" = "true" ]; then
              failed_ids+=("$id|$name|$branch|$status|$created|$url|dry-run 未尝试取消")
              continue
            fi

            # 直接打 API 而不是 gh run cancel：后者依赖 git 上下文，
            # 未 checkout 的工作区里会报 "failed to determine base repo"。
            if out=$(gh api -X POST "repos/$REPO/actions/runs/$id/cancel" 2>&1); then
              cancelled=$((cancelled + 1))
              echo "  → 已发出取消请求"
            else
              # 从 gh 的错误输出里只取 message 字段，避免整段 JSON 塞进表格
              reason=$(echo "$out" | grep -o '"message":"[^"]*"' | head -1 \
                | sed 's/"message":"//; s/"$//')
              [ -z "$reason" ] && reason=$(echo "$out" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-160)
              echo "  → 取消失败：$reason"
              failed_ids+=("$id|$name|$branch|$status|$created|$url|$reason")
            fi
          done < "$tmp"

          echo
          echo "扫描完成：卡死 $stuck 条，取消成功 $cancelled 条，取消失败 ${#failed_ids[@]} 条"

          if [ ${#failed_ids[@]} -eq 0 ]; then
            echo "无需开 issue。"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true：以下运行会被上报，但不创建 issue、不取消："
            for row in "${failed_ids[@]}"; do
              IFS='|' read -r id name branch status created url reason <<< "$row"
              echo "  #$id $name [$branch] $status $created $url"
            done
            exit 0
          fi

          # ---- 汇总 issue（去重）----
          gh label create ci-stuck --color BFB8FF \
            --description "CI 运行卡死，需人工或 GitHub Support 处理" >/dev/null 2>&1 || true

          body=$(mktemp)
          {
            echo "定时扫描发现 **${#failed_ids[@]}** 条运行卡在 \`in_progress\` / \`queued\` 超过 ${MAX_AGE_HOURS} 小时，"
            echo "取消接口也拒绝处理（409）。"
            echo
            echo "这类状态通常是 GitHub 侧状态死锁：API 投影仍是运行中，内部已按完成处理，"
            echo "因此 cancel / force-cancel / rerun / delete 会互相矛盾地全部被拒。"
            echo
            echo "| run | workflow | 分支 | 状态 | 创建时间 | 取消失败原因 |"
            echo "|---|---|---|---|---|---|"
            for row in "${failed_ids[@]}"; do
              IFS='|' read -r id name branch status created url reason <<< "$row"
              echo "| [#$id]($url) | $name | \`$branch\` | $status | $created | ${reason//|/\\|} |"
            done
            echo
            echo "<sub>由 \`.github/workflows/stuck-run-watchdog.yml\` 自动生成 · $(date -u +%Y-%m-%dT%H:%M:%SZ)</sub>"
          } > "$body"

          existing=$(gh issue list --label ci-stuck --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "已有开启中的 issue #$existing，追加评论"
            gh issue comment "$existing" --body-file "$body"
          else
            echo "新建 issue"
            gh issue create \
              --title "CI 运行卡死：${#failed_ids[@]} 条无法取消的 in_progress/queued 运行" \
              --label ci-stuck \
              --body-file "$body"
          fi
