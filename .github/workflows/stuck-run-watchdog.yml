name: stuck-run-watchdog

# 定时扫描本仓库卡死的 workflow 运行：状态停在 in_progress / queued 且已超过阈值。
#
# 背景：GitHub 偶发「矩阵腿未被创建」或「运行排队不启动」，此时运行会永远停在
# in_progress / queued，且所有补救接口互相矛盾（cancel 说已完成、force-cancel 说
# 不在运行、rerun 说正在运行、delete 返回 403）。这类死锁只能人工跟进，但没有监控
# 时根本不会有人发现——曾有一条挂 11 小时才被偶然看到。
#
# 行为（三条分支，全自动闭环）：
#   1) 扫不到任何卡死运行 → 自动关闭 ci-stuck issue；
#   2) 有卡死但全部取消成功 → 只记日志，不开 issue；
#   3) 取消不掉的 → 按 ci-stuck 标签汇总成 issue，正文带 run 链接与报错原文。
#      已有开启中的 issue 时，只在出现「正文没记录过的 run id」时追加评论，
#      避免同两条僵尸每 3 小时刷一条重复评论。
on:
  schedule:
    # 每 3 小时一次，避开整点（GitHub 定时任务在整点最拥挤，常被延迟数十分钟）
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: '判定卡死的时长阈值（小时）'
        required: false
        default: '2'
      dry_run:
        description: '只报告不取消、不建/关 issue（true / false）'
        required: false
        default: 'false'

permissions:
  actions: write   # 取消运行
  issues: write    # 建 / 评论 / 关闭提醒 issue
  contents: read

# 自身不并发，避免两次扫描同时操作同一个 issue
concurrency:
  group: stuck-run-watchdog
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 扫描并处理卡死运行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh 未 checkout 时无法从 git 推断仓库，所有命令必须靠 GH_REPO 定位
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '2' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          if ! [[ "$MAX_AGE_HOURS" =~ ^[0-9]+$ ]]; then
            echo "::error::max_age_hours 必须是整数，收到：$MAX_AGE_HOURS"
            exit 1
          fi
          cutoff=$(date -u -d "-${MAX_AGE_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          echo "阈值：创建时间早于 $cutoff（即已卡死超过 ${MAX_AGE_HOURS}h）"
          echo "dry_run=$DRY_RUN"

          # 只取 in_progress / queued 两种状态。waiting（等待部署审批）是合法状态，不处理。
          # 每页 100 条足够：本仓库历史运行总量远小于该值；超出的极端情况下一轮会补上。
          tmp=$(mktemp)
          : > "$tmp"
          for st in in_progress queued; do
            gh api "repos/$REPO/actions/runs?status=$st&per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .head_branch, .created_at, .status, (.html_url)] | @tsv' \
              >> "$tmp" || true
          done

          stuck=0
          cancelled=0
          failed_rows=()
          while IFS=$'\t' read -r id name branch created status url; do
            [ -z "${id:-}" ] && continue
            # 跳过自己
            [ "$id" = "$SELF_RUN_ID" ] && continue
            # created_at 是 ISO8601 Z，字符串比较对同格式有效
            [[ "$created" < "$cutoff" ]] || continue

            stuck=$((stuck + 1))
            echo "::warning::卡死运行 #$id $name [$branch] status=$status created=$created"
            echo "  $url"

            if [ "$DRY_RUN" = "true" ]; then
              failed_rows+=("$id|$name|$branch|$status|$created|$url|dry-run 未尝试取消")
              continue
            fi

            # 直接打 API 而不是 gh run cancel：后者依赖 git 上下文，
            # 未 checkout 的工作区里会报 "failed to determine base repo"。
            if out=$(gh api -X POST "repos/$REPO/actions/runs/$id/cancel" 2>&1); then
              cancelled=$((cancelled + 1))
              echo "  → 已发出取消请求"
            else
              # 只取 message 字段，避免整段 JSON 塞进表格
              reason=$(echo "$out" | grep -o '"message":"[^"]*"' | head -1 \
                | sed 's/"message":"//; s/"$//')
              [ -z "$reason" ] && reason=$(echo "$out" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-160)
              echo "  → 取消失败：$reason"
              failed_rows+=("$id|$name|$branch|$status|$created|$url|$reason")
            fi
          done < "$tmp"

          echo
          echo "扫描完成：卡死 $stuck 条，取消成功 $cancelled 条，取消失败 ${#failed_rows[@]} 条"

          # ---------- 分支 1：本轮没有任何卡死运行 → 自动关闭 issue ----------
          if [ "$stuck" -eq 0 ]; then
            open_issue=$(gh issue list --label ci-stuck --state open --limit 1 \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -z "$open_issue" ]; then
              echo "无卡死运行，且没有开启中的 ci-stuck issue。"
              exit 0
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry_run=true：本应关闭 issue #$open_issue（未发现卡死运行）"
              exit 0
            fi
            echo "未发现卡死运行，关闭 issue #$open_issue"
            gh issue comment "$open_issue" --body \
              "本轮扫描未发现卡在 \`in_progress\` / \`queued\` 超过 ${MAX_AGE_HOURS}h 的运行，自动关闭。"
            gh issue close "$open_issue" --reason completed
            exit 0
          fi

          # ---------- 分支 2：有卡死运行，但全部取消成功 → 不开 issue ----------
          if [ ${#failed_rows[@]} -eq 0 ]; then
            echo "卡死运行已全部发出取消请求，无需开 issue。"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true：以下运行会被上报，但不取消、不建 issue："
            for row in "${failed_rows[@]}"; do
              IFS='|' read -r id name branch status created url reason <<< "$row"
              echo "  #$id $name [$branch] $status $created $url"
            done
            exit 0
          fi

          # ---------- 分支 3：取消不掉的运行 → 汇总 issue（按 run id 去重）----------
          gh label create ci-stuck --color BFB8FF \
            --description "CI 运行卡死，需人工或 GitHub Support 处理" >/dev/null 2>&1 || true

          existing=$(gh issue list --label ci-stuck --state open --limit 1 \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$existing" ]; then
            # 已有 issue：只有出现「正文里没记录过的 run id」时才追加评论，
            # 否则同两条僵尸会每 3 小时刷一条重复评论。
            known=$(gh issue view "$existing" --json body --jq .body)
            fresh=()
            for row in "${failed_rows[@]}"; do
              IFS='|' read -r id _ <<< "$row"
              if echo "$known" | grep -q "#$id"; then
                echo "run #$id 已在 issue #$existing 中记录，跳过"
              else
                fresh+=("$row")
              fi
            done
            if [ ${#fresh[@]} -eq 0 ]; then
              echo "全部已记录，无需追加评论。"
              exit 0
            fi
            echo "issue #$existing 中有 ${#fresh[@]} 条新卡死运行，追加评论"
            failed_rows=("${fresh[@]}")
          fi

          body=$(mktemp)
          {
            echo "定时扫描发现 **${#failed_rows[@]}** 条运行卡在 \`in_progress\` / \`queued\` 超过 ${MAX_AGE_HOURS} 小时，"
            echo "取消接口也拒绝处理（409）。"
            echo
            echo "这类状态通常是 GitHub 侧状态死锁：API 投影仍是运行中，内部已按完成处理，"
            echo "因此 cancel / force-cancel / rerun / delete 会互相矛盾地全部被拒。"
            echo
            echo "| run | workflow | 分支 | 状态 | 创建时间 | 取消失败原因 |"
            echo "|---|---|---|---|---|---|"
            for row in "${failed_rows[@]}"; do
              IFS='|' read -r id name branch status created url reason <<< "$row"
              echo "| [#$id]($url) | $name | \`$branch\` | $status | $created | ${reason//|/\\|} |"
            done
            echo
            echo "<sub>由 \`.github/workflows/stuck-run-watchdog.yml\` 生成 · $(date -u +%Y-%m-%dT%H:%M:%SZ)</sub>"
          } > "$body"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            echo "新建 issue"
            gh issue create \
              --title "CI 运行卡死：${#failed_rows[@]} 条无法取消的 in_progress/queued 运行" \
              --label ci-stuck \
              --body-file "$body"
          fi
