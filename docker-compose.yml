services:
  wb2api:
    # 默认使用 CI 发布的多架构镜像（linux/amd64 + linux/arm64），无需本地构建。
    # 版本可用环境变量锁定：WB2API_TAG=1.16.2 docker compose up -d
    image: ghcr.io/jin66god/workbuddy2api:${WB2API_TAG:-latest}
    # 需要从源码构建时（main / 自行改代码）：
    #   docker compose build --no-cache && docker compose up -d
    # 注意：image 与 build 同时存在时 compose 不会自动构建，必须显式 --build。
    build:
      context: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 优雅关停宽限期：Docker 默认只有 10s，10 秒后直接 SIGKILL，
    # server.shutdown_timeout（缺省 30s）根本没机会走完排干 —— 长 SSE 会被掐成连接重置。
    # 这里给 130s（上限，不是固定耗时：请求做完进程即退出，Docker 立即返回）。
    # 自己调过 server.shutdown_timeout 时，保持在它之上 5~10s。
    stop_grace_period: 130s
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
      # 容器内必须绑 0.0.0.0，否则宿主机端口映射进来的连接会被拒；对外仍由 ports/反代控制
      - WB2A_LISTEN=0.0.0.0:7863
      # 更新提醒默认开启（每 6 小时查一次 GitHub Releases，结果展示在面板顶栏）。
      # 不需要就设 WB2API_UPDATE_CHECK=0。
      # - WB2API_UPDATE_CHECK=1
      # - WB2API_UPDATE_INTERVAL=6h
      # 面板「立即更新」按钮的执行者：旁路升级器（下面注掉的 watcher 服务）。
      # 留空时按钮降级为「复制命令」，面板本身不持有 Docker 权限。
      - WB2API_WATCHTOWER_URL=${WB2API_WATCHTOWER_URL:-}
      - WB2API_WATCHTOWER_TOKEN=${WB2API_WATCHTOWER_TOKEN:-}
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json

  # ── 可选：旁路升级器（让面板的「立即更新」真的能一键） ─────────────────────
  # 为什么需要它：面板跑在容器里，既没有 docker CLI 也没有 socket；把 socket 给
  # 面板等于把宿主 root 交出去。这里让 watchtower 独占 socket，只更新带下面
  # label 的本容器，面板只向它的 HTTP API 发一次 POST。
  #
  # 启用步骤：
  #   1) 取消下面整段注释，并在 wb2api 服务上加 label（见文件末尾说明）
  #   2) echo "WB2API_WATCHTOWER_URL=http://watcher:8080" >> .env
  #      echo "WB2API_WATCHTOWER_TOKEN=$(openssl rand -hex 16)" >> .env
  #   3) docker compose up -d
  # watcher:
  #   image: containrrr/watchtower:latest
  #   container_name: wb2api-watcher
  #   restart: unless-stopped
  #   command: --http-api-update --label-enable --cleanup
  #   environment:
  #     - WATCHTOWER_HTTP_API_TOKEN=${WB2API_WATCHTOWER_TOKEN}
  #     - TZ=Asia/Shanghai
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #
  # 并在 wb2api 服务下加（与 environment 同级）：
  #   labels:
  #     com.centurylinklabs.watchtower.enable: "true"
